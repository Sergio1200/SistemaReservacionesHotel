<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/estructura :: pagina('Nueva reservación', '/reservaciones/nueva', ~{::main})}">
<body>
    <main id="contenido" class="app-content app-main" tabindex="-1">
        <header th:replace="~{fragmentos/componentes :: encabezado('Nueva reservación', 'Selecciona una habitación y las fechas de la estancia.')}"></header>
        <div class="work-grid">
            <section class="surface form-surface" aria-labelledby="datos-reservacion">
                <h2 id="datos-reservacion">Datos de la reservación</h2>
                <form class="form-stack" th:action="@{/reservaciones/nueva}" method="post" th:object="${reservacionForm}">
                    <div th:if="${sesion.recepcion}">
                        <label class="form-label" for="huespedId">Huésped</label>
                        <select class="form-select" th:field="*{huespedId}" th:errorclass="is-invalid" required>
                            <option value="">Selecciona un huésped</option>
                            <option th:each="huesped : ${huespedes}" th:value="${huesped.id}" th:text="${huesped.etiqueta}"></option>
                        </select>
                        <p class="invalid-feedback mb-0" th:errors="*{huespedId}"></p>
                    </div>
                    <th:block th:replace="~{fragmentos/reservacion :: campos}"></th:block>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Registrar reservación</button>
                        <a class="text-link" th:href="@{/reservaciones}">Volver al listado</a>
                    </div>
                </form>
            </section>
            <section class="surface form-surface related-surface" aria-labelledby="modulos-reservacion">
                <h2 id="modulos-reservacion">Disponibilidad y tarifa</h2>
                <p class="text-secondary">Al guardar se volverán a comprobar la disponibilidad y la tarifa vigente.</p>
                <a class="text-link" th:href="@{/disponibilidad}">Consultar disponibilidad</a>
            </section>
        </div>
    </main>
</body>
</html>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="habitacion">
    <div class="row g-3">
        <div class="col-7">
            <label class="form-label" for="numero">Número de habitación</label>
            <input class="form-control" th:field="*{numero}" th:errorclass="is-invalid" type="text" maxlength="20" required>
            <p class="invalid-feedback" th:errors="*{numero}"></p>
        </div>
        <div class="col-5">
            <label class="form-label" for="piso">Piso</label>
            <input class="form-control" th:field="*{piso}" th:errorclass="is-invalid" type="number" min="0" step="1" required>
            <p class="invalid-feedback" th:errors="*{piso}"></p>
        </div>
    </div>
    <div>
        <label class="form-label" for="idTipo">Tipo de habitación</label>
        <select class="form-select" th:field="*{idTipo}" th:errorclass="is-invalid" required>
            <option value="">Selecciona un tipo</option>
            <option th:each="tipo : ${tipos}" th:value="${tipo.idTipo}" th:text="|${tipo.nombre} (${tipo.capacidad})|"></option>
        </select>
        <p class="invalid-feedback" th:errors="*{idTipo}"></p>
    </div>
    <div>
        <label class="form-label" for="precio">Precio por noche (MXN)</label>
        <input class="form-control" th:field="*{precio}" th:errorclass="is-invalid" type="number"
               min="0.01" max="9999999999.99" step="0.01" required>
        <p class="invalid-feedback" th:errors="*{precio}"></p>
    </div>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="tipo">
    <div>
        <label class="form-label" for="nombre">Nombre del tipo</label>
        <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid" type="text" maxlength="80" required>
        <p class="invalid-feedback" th:errors="*{nombre}"></p>
    </div>
    <div>
        <label class="form-label" for="capacidad">Capacidad</label>
        <input class="form-control" th:field="*{capacidad}" th:errorclass="is-invalid" type="number" min="1" step="1" required>
        <p class="invalid-feedback" th:errors="*{capacidad}"></p>
    </div>
    <div>
        <label class="form-label" for="descripcion">Descripción</label>
        <textarea class="form-control" th:field="*{descripcion}" th:errorclass="is-invalid" rows="3" maxlength="255"></textarea>
        <p class="invalid-feedback" th:errors="*{descripcion}"></p>
    </div>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="errores">
    <div class="alert alert-danger mb-0" role="alert" th:if="${#fields.hasGlobalErrors()}">
        <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>
</th:block>

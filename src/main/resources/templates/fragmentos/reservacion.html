<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="campos">
    <div class="alert alert-warning mb-0" role="alert" th:if="${#fields.hasGlobalErrors()}">
        <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
    </div>
    <div>
        <label class="form-label" for="habitacionId">Habitación</label>
        <select class="form-select" th:field="*{habitacionId}" th:errorclass="is-invalid" required>
            <option value="">Selecciona una habitación</option>
            <option th:each="habitacion : ${habitaciones}" th:value="${habitacion.id}" th:text="${habitacion.etiqueta}"></option>
        </select>
        <p class="invalid-feedback mb-0" th:errors="*{habitacionId}"></p>
    </div>
    <div class="row g-3">
        <div class="col-sm-6">
            <label class="form-label" for="entrada">Fecha de entrada</label>
            <input class="form-control" type="date" th:field="*{entrada}" th:errorclass="is-invalid" th:attr="min=${hoy}" required>
            <p class="invalid-feedback mb-0" th:errors="*{entrada}"></p>
        </div>
        <div class="col-sm-6">
            <label class="form-label" for="salida">Fecha de salida</label>
            <input class="form-control" type="date" th:field="*{salida}" th:errorclass="is-invalid" required>
            <p class="invalid-feedback mb-0" th:errors="*{salida}"></p>
        </div>
    </div>
    <div>
        <label class="form-label" for="personas">Número de huéspedes</label>
        <input class="form-control" type="number" min="1" step="1" th:field="*{personas}" th:errorclass="is-invalid" required>
        <p class="invalid-feedback mb-0" th:errors="*{personas}"></p>
    </div>
</th:block>
<span xmlns:th="http://www.thymeleaf.org" th:fragment="estado(estado)" class="status"
      th:classappend="${estado.name() == 'PENDIENTE' ? 'status-amber' : (estado.name() == 'CANCELADA' ? 'status-neutral' : 'status-blue')}"
      th:text="${estado.etiqueta}"></span>

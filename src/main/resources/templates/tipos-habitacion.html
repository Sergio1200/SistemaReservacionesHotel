<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/estructura :: pagina('Tipos de habitación', '/tipos-habitacion', ~{::main})}">
<body>
    <main id="contenido" class="app-content app-main" tabindex="-1">
        <header th:replace="~{fragmentos/componentes :: encabezado('Tipos de habitación', 'Define las categorías y su capacidad para asignarlas en el inventario.')}"></header>
        <p class="alert alert-success" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></p>
        <div class="work-grid inventario-grid">
            <section class="surface" aria-labelledby="catalogo-tipos">
                <div class="surface-heading"><h2 id="catalogo-tipos">Catálogo</h2></div>
                <p class="table-note" th:if="${#lists.isEmpty(tipos)}">Aún no hay tipos de habitación registrados.</p>
                <div class="table-responsive" tabindex="0" role="region" aria-labelledby="catalogo-tipos"
                     th:unless="${#lists.isEmpty(tipos)}">
                    <table class="table data-table tabla-tipos">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th><th scope="col">Capacidad</th>
                                <th scope="col">Descripción</th><th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="tipo : ${tipos}">
                                <th scope="row" class="texto-inventario" th:text="${tipo.nombre}"></th>
                                <td th:text="${tipo.capacidad}"></td>
                                <td class="texto-inventario" th:text="${#strings.isEmpty(tipo.descripcion) ? 'Sin descripción' : tipo.descripcion}"></td>
                                <td>
                                    <div class="acciones-inventario">
                                        <a class="text-link" th:href="@{/tipos-habitacion/{id}/editar(id=${tipo.idTipo})}"
                                           th:aria-label="|Editar tipo ${tipo.nombre}|">Editar</a>
                                        <a class="text-link" th:href="@{/tipos-habitacion/{id}/eliminar(id=${tipo.idTipo})}"
                                           th:aria-label="|Revisar eliminación del tipo ${tipo.nombre}|">Eliminar</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="surface form-surface" aria-labelledby="formulario-tipo">
                <h2 id="formulario-tipo">Registrar tipo</h2>
                <form class="form-stack" th:action="@{/tipos-habitacion}" th:object="${tipoHabitacionForm}" method="post">
                    <th:block th:replace="~{fragmentos/inventario-formularios :: tipo}"></th:block>
                    <div class="form-actions"><button class="btn btn-primary" type="submit">Registrar tipo</button></div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/estructura :: pagina('Inicio', '/', ~{::main})}">
<body>
    <main id="contenido" class="app-content app-main" tabindex="-1">
        <section class="welcome-panel" aria-labelledby="titulo-inicio">
            <div class="welcome-copy">
                <h1 id="titulo-inicio">Sistema de Gestión de Reservaciones de Hotel</h1>
                <p>Te damos la bienvenida al portal del hotel, un espacio para que los huéspedes y el personal puedan gestionar las reservaciones.</p>
                <a class="btn welcome-link" th:href="@{/panel}">Abrir panel principal</a>
            </div>
            <img class="welcome-image" th:src="@{/img/vestibulo-hotel.webp}" width="1200" height="800" alt="">
        </section>

        <section class="surface institutional-summary" aria-labelledby="titulo-institucion">
            <div>
                <h2 id="titulo-institucion">Centro Universitario UAEMéx Atlacomulco</h2>
                <a class="text-link" th:href="@{/acerca-de}">Acerca del proyecto</a>
            </div>
            <div th:replace="~{fragmentos/componentes :: logotiposInstitucionales}"></div>
        </section>

        <section class="home-modules" aria-labelledby="titulo-accesos">
            <h2 id="titulo-accesos">Accesos directos</h2>
            <div class="module-grid">
                <a th:replace="~{fragmentos/componentes :: tarjeta('/disponibilidad', 'Consultar disponibilidad', 'Fechas de estancia y número de huéspedes.', 'calendario')}"></a>
                <a th:replace="~{fragmentos/componentes :: tarjeta('/reservaciones', 'Consultar reservaciones', 'Fechas, habitaciones y estado de cada estancia.', 'lista')}"></a>
                <a th:replace="~{fragmentos/componentes :: tarjeta('/habitaciones', 'Gestionar habitaciones', 'Inventario, tarifas y estado operativo.', 'habitacion')}"></a>
            </div>
        </section>
    </main>
</body>
</html>

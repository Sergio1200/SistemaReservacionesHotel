<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/estructura :: pagina('Gestión de pagos', '/pagos', ~{::main})}">
<body>
    <main id="contenido" class="app-content app-main" tabindex="-1">
        <header th:replace="~{fragmentos/componentes :: encabezado('Gestión de pagos', 'Busca una reservación para consultar y validar sus pagos simulados.')}"></header>
        <section class="surface" aria-labelledby="reservaciones-pago">
            <div class="surface-heading"><h2 id="reservaciones-pago">Reservaciones</h2></div>
            <form class="busqueda-huespedes" method="get" th:action="@{/pagos}" role="search">
                <label class="form-label" for="buscar-pago">Buscar por número, nombre o correo del huésped</label>
                <div class="busqueda-huespedes-campos">
                    <input class="form-control" id="buscar-pago" type="search" name="q" th:value="${q}" maxlength="254">
                    <button class="btn btn-outline-primary" type="submit">Buscar</button>
                    <a class="text-link" th:if="${!q.isEmpty()}" th:href="@{/pagos}">Limpiar</a>
                </div>
            </form>
            <p class="table-note mb-0" th:if="${#lists.isEmpty(reservaciones)}"
               th:text="${q.isEmpty() ? 'Aún no hay reservaciones.' : 'No hay reservaciones que coincidan con la búsqueda.'}"></p>
            <div class="table-responsive" tabindex="0" role="region" aria-labelledby="reservaciones-pago"
                 th:unless="${#lists.isEmpty(reservaciones)}">
                <table class="table data-table">
                    <thead>
                        <tr><th scope="col">Reservación</th><th scope="col">Huésped</th><th scope="col">Habitación</th>
                            <th scope="col">Total (MXN)</th><th scope="col">Estado de reservación</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reservaciones}">
                            <th scope="row"><a class="text-link" th:href="@{/reservaciones/{id}/pagos(id=${r.id})}"
                                               th:text="|#${r.id}|" th:aria-label="|Ver pagos de reservación ${r.id}|"></a></th>
                            <td class="texto-inventario" th:text="${r.titular}"></td>
                            <td th:text="|${r.habitacion} · ${r.tipo}|"></td>
                            <td th:text="${#numbers.formatDecimal(r.total, 1, 2)}"></td>
                            <td><span th:replace="~{fragmentos/reservacion :: estado(${r.estado})}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/estructura :: pagina('Gestión de habitaciones', '/habitaciones', ~{::main})}">
<body>
    <main id="contenido" class="app-content app-main" tabindex="-1">
        <header th:replace="~{fragmentos/componentes :: encabezado('Gestión de habitaciones', 'Revisa el inventario, las tarifas y el estado operativo.')}"></header>
        <div class="work-grid">
            <section class="surface" aria-labelledby="inventario-habitaciones">
                <div class="surface-heading">
                    <h2 id="inventario-habitaciones">Inventario</h2>
                    <span class="sample-label">Registros de ejemplo</span>
                </div>
                <div class="table-responsive" tabindex="0" role="region" aria-label="Tabla de habitaciones de ejemplo">
                    <table class="table data-table">
                        <thead><tr><th scope="col">Número</th><th scope="col">Piso</th><th scope="col">Tipo</th><th scope="col">Precio por noche</th><th scope="col">Estado</th></tr></thead>
                        <tbody>
                            <tr><th scope="row">101</th><td>1</td><td>Individual</td><td>$850.00</td><td><span class="status status-green">Disponible</span></td></tr>
                            <tr><th scope="row">202</th><td>2</td><td>Doble</td><td>$1,200.00</td><td><span class="status status-blue">Ocupada</span></td></tr>
                            <tr><th scope="row">301</th><td>3</td><td>Suite</td><td>$1,950.00</td><td><span class="status status-green">Disponible</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <section class="surface form-surface" aria-labelledby="formulario-habitacion">
                <h2 id="formulario-habitacion">Registrar habitación</h2>
                <form data-prototipo method="post" autocomplete="off" class="form-stack">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label" for="numero-habitacion">Número</label>
                            <input class="form-control" id="numero-habitacion" type="text">
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="piso-habitacion">Piso</label>
                            <input class="form-control" id="piso-habitacion" type="number" step="1">
                        </div>
                    </div>
                    <div>
                        <label class="form-label" for="tipo-habitacion">Tipo de habitación</label>
                        <select class="form-select" id="tipo-habitacion">
                            <option value="" selected disabled>Selecciona un tipo</option>
                            <option>Individual</option><option>Doble</option><option>Suite</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="precio-habitacion">Precio por noche (MXN)</label>
                        <input class="form-control" id="precio-habitacion" type="number" min="0" step="0.01">
                    </div>
                    <div>
                        <label class="form-label" for="estado-habitacion">Estado operativo</label>
                        <select class="form-select" id="estado-habitacion">
                            <option>Disponible</option><option>Ocupada</option>
                        </select>
                    </div>
                    <div th:replace="~{fragmentos/componentes :: accionDemo('Guardar habitación')}"></div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>

spring.application.name=ReservacionesHotel
server.port=8080
hotel.zona-horaria=${HOTEL_ZONA_HORARIA:America/Mexico_City}

spring.datasource.url=jdbc:mysql://${HOTEL_DB_HOST:127.0.0.1}:${HOTEL_DB_PORT:3306}/hotel_reservaciones
spring.datasource.username=${HOTEL_DB_USER}
spring.datasource.password=${HOTEL_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
